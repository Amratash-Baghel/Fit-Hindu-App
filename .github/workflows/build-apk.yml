name: Build Android APK

# Manual trigger only — for building a shareable, installable APK (EAS
# "preview" profile) without needing a computer or USB debugging. Runs the
# `eas build` CLI here (GitHub Actions has normal internet access); the
# actual native build happens in Expo's cloud, same as running it locally.
#
# One-time setup before this is usable, see docs/deploy.md:
#   1. Add an EXPO_TOKEN repo secret (expo.dev → account settings →
#      access tokens). Settings → Secrets and variables → Actions.
#   2. This workflow file must be present on the default branch for the
#      "Run workflow" button to show up in the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Link EAS project (no-op once app.json already has extra.eas.projectId)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --non-interactive --force

      - name: Commit EAS project link if this was the first run
        run: |
          if ! git diff --quiet -- app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Link EAS project (eas init)"
            git push
          fi

      - name: Build Android APK (preview profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait --json > eas-build-output.json

      - name: Surface install link
        run: |
          node -e "
            const b = JSON.parse(require('fs').readFileSync('eas-build-output.json', 'utf8'))[0];
            const lines = [
              '### APK build finished',
              '',
              '**Install link (APK):** ' + (b.artifacts && b.artifacts.buildUrl || 'not available — check the dashboard link below'),
              '',
              '**Build dashboard (QR code + install link):** ' + b.buildDetailsPageUrl,
            ];
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "
